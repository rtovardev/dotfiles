[ui.sidebar.spaces]
rows = [["state_icon", { token = "workspace", rules = [{ contains = "⠀", bold = true }] }, { token = "branch", dim = true }, "git_status"]]

[ui]
show_agent_labels_on_pane_borders = false
mouse_capture = true

# Se mantiene en false: libera la columna reservada del scrollbar y la deja
# fuera de las selecciones con Shift+arrastre.
pane_scrollbars = false
agent_panel_sort = "spaces" # herdr-agent-usage

[experimental]
kitty_graphics = true
allow_nested = true

[keys]
# Saltar directo al agente anterior/siguiente del panel lateral
previous_agent = "ctrl+alt+left"
next_agent = "ctrl+alt+right"

[[keys.command]]
key = "prefix+e"
type = "shell"
command = "herdr plugin pane open --plugin ttt.editor --entrypoint editor"
description = "open TTT editor"

[[keys.command]]
key = "prefix+shift+r"
type = "plugin_action"
command = "herdr-agent-usage.refresh"
description = "refresh all agent quotas"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "rcosteira.account-switch.next"
description = "switch to next account"

[[keys.command]]
key = "prefix+shift+a"
type = "shell"
command = "herdr plugin pane open --plugin rcosteira.account-switch --entrypoint picker --env TERM=xterm-256color"
description = "open account picker"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-tsk.open-board"
description = "open or focus tsk board"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "herdr-tsk.quick-capture"
description = "quick capture task in tsk"

[[keys.command]]
key = "prefix+shift+q"
type = "plugin_action"
command = "herdr-agent-usage.open-settings"
description = "open agent quota settings"
